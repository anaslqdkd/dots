$wall = /home/ash/images/wallpapers/lock.png
$music = /home/ash/.config/hypr/scripts/music.sh
$battery = /home/ash/.config/hypr/scripts/battery.sh

general {
    immediate_render = true
    no_fade_in = true
    no_fade_out = true
    disable_loading_bar = false
    hide_cursor = false
    transparent = true
}


# BACKGROUND
background {
    path = $wall
    blur_passes = 0

}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H")</span>"
    color =rgb(240, 231, 219)
    font_size = 60
    position = -60, 400
    halign = center
    valign = center
}


# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +":%M")</span>"
    color = rgb(214, 209, 209)
    font_size = 60
    position = 45, 400
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgb(200, 200, 200)
    font_size = 19
    position = 0, 340
    halign = center
    valign = center
}



# INPUT FIELD
input-field {
    monitor =
    size = 200, 50
    outline_thickness = 1
    outer_color = rgba(0, 0, 0, 0)
    dots_size = 0.1 
    dots_spacing = 1 
    dots_center = true
	inner_color = rgba(255, 255, 255, 0.2) 
	font_color = rgba(255, 255, 255, 0.5) 
    fade_on_empty = false
    placeholder_text =<i>Hii $USER ;) </i>
    invert_numlock = true 
    capslock_color = rgba(255, 0, 0, 1)
    hide_input = false
    position = 0, -220
    halign = center
    valign = center
    zindex = 20
}

# music div
shape {
    monitor =
    size = 340, 140
    color = rgba(0, 0, 0, 0.7)
    rounding = 30
    rotate = 0
    position = -30, -50
    halign = right
    valign = top
    zindex = 1
}

# PLAYER SOURCE
label {
    monitor =
    text = cmd[update:1000] $music --source 
    color = rgba(255, 255, 255, 0.6)
    font_size = 10
    position = 1570, -65
    halign = left
    valign = top
    zindex = 5
}



# PLAYER TITLE
label {
    monitor =
    text = cmd[update:1000] $music --title
    color = rgba(255, 255, 255, 0.8)
    font_size = 12
    position = 1570, -95
    halign = left
    valign = top
    zindex = 5
}



# PLAYER ARTIST
label {
    monitor =
    text = cmd[update:1000] $music --artist
    color = rgba(255, 255, 255, 0.8)
    font_size = 10
    position = 1570, -115
    halign = left
    valign = top
    zindex = 5
}


# PLAYER STATUS
label {
    monitor =
    text = cmd[update:1000] $music --status
    color = rgba(255, 255, 255, 1)
    font_size = 21
    position = -190, -138
    halign = right
    valign = top
    zindex = 5
}


# Battery div
shape {
    monitor =
    size = 70, 40
    color = rgba(0, 0, 0, 0.7)
    # color =rgb(240, 170, 170)
    rounding = 20
    rotate = 0
    position = -40, -220
    halign = right
    valign = top
    zindex = 1
}

# Battery
label {
    monitor =
    text = cmd[update:1000] $battery
	color = rgb(255, 255, 255)
    font_size = 10
    position = -60, -235
    halign = right
    valign = top
    zindex = 5
}
